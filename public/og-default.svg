      <stop offset="0%" stop-color="#07080d" />
      <stop offset="100%" stop-color="#0f1018" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
