# Deploys the portfolio to GitHub Pages at https://mahavirvataliya.github.io
#
# One-time repo setup (Settings → Pages):
#   Source: GitHub Actions
#
# Then every push to main builds and publishes automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-flight runs for the same branch; only one deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node, which needs the pnpm
      # executable to resolve its dependency cache.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from packageManager in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Contact form key — add under repo Settings → Secrets and variables
          # → Actions as the secret WEB3FORMS_ACCESS_KEY. Optional: the form
          # renders with a friendly fallback without it.
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
